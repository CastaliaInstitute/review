<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review — Castalia Institute</title>
  <meta name="description" content="Critical three-faculty reviews of books at Castalia Institute." />
  <style>
    :root {
      color-scheme: light dark;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --line: rgba(0,0,0,.12);
      --bg: #faf9f7;
      --accent: #2c5282;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e8e6e3;
        --muted: #9a9690;
        --line: rgba(255,255,255,.14);
        --bg: #121110;
        --accent: #90cdf4;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }
    main {
      max-width: 38rem;
      margin: 0 auto;
      padding: clamp(2rem, 6vw, 4rem) clamp(1.25rem, 4vw, 2rem);
    }
    h1 {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
    }
    .lede {
      font-size: 1.125rem;
      color: var(--muted);
      margin: 0 0 2rem;
    }
    section {
      border-top: 1px solid var(--line);
      padding-top: 1.5rem;
      margin-top: 1.5rem;
    }
    h2 {
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 0.75rem;
    }
    p { margin: 0 0 1rem; }
    a { color: var(--accent); }
    footer {
      margin-top: 3rem;
      font-size: 0.875rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Review</h1>
    <p class="lede">Critical three-faculty reviews of books — Castalia Institute.</p>
    <section>
      <h2>Coming soon</h2>
      <p>
        This site will publish structured book reviews from three faculty perspectives.
        Content and listings will appear here as the series goes live.
      </p>
    </section>
    <footer>
      <a href="https://castalia.institute/">Castalia Institute</a>
    </footer>
  </main>
</body>
</html>
